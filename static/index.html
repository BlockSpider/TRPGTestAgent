<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRPG Board</title>
<style>
  :root {
    --bg: #f4f4f2; --panel: #ffffff; --text: #222; --muted: #777;
    --board: #fbfbf8; --grid: #e2e2dc; --grid-major: #c4c4bb; --accent: #2f6fde;
    --ok: #30a46c; --ng: #e5484d;
    --t-wall: #55555a; --t-water: #8cbbe8; --t-rough: #d4c09a; --t-high: #a8cf9f;
    --e-wall: #2b2b30; --e-window: #4fa3e0; --e-door: #9a6532;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --panel: #222326; --text: #e8e8e8; --muted: #999;
      --board: #1d1e21; --grid: #2c2d31; --grid-major: #44464c; --accent: #6b9bff;
      --t-wall: #8a8a90; --t-water: #2f5f8f; --t-rough: #6e5d3d; --t-high: #3f6b45;
      --e-wall: #d8d8dc; --e-window: #6cc0ff; --e-door: #d08a48;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
    padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--grid); }
  header h1 { font-size: 15px; margin: 0 8px 0 0; }
  .group { display: flex; gap: 6px; align-items: center; }
  .group[hidden] { display: none; }
  label { white-space: nowrap; }
  .swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .swatch.active { border-color: var(--text); }
  .tile { min-width: 32px; height: 28px; border-radius: 5px; border: 1px solid var(--grid-major);
    border-bottom: 5px solid var(--swatch, var(--grid-major)); background: transparent;
    cursor: pointer; padding: 0 8px; font: inherit; font-size: 12px; color: var(--text); }
  .tile.active { outline: 2px solid var(--accent); outline-offset: 1px; }
  .seg { display: inline-flex; border: 1px solid var(--grid-major); border-radius: 6px; overflow: hidden; }
  .seg button { background: transparent; color: var(--text); border: 0; padding: 4px 12px; cursor: pointer; font: inherit; }
  .seg button.active { background: var(--accent); color: #fff; }
  button.btn { background: transparent; color: var(--text); border: 1px solid var(--grid-major);
    border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
  button.btn:hover { border-color: var(--accent); }
  input[type=text] { width: 96px; font: inherit; padding: 3px 6px; border-radius: 6px;
    border: 1px solid var(--grid-major); background: var(--board); color: var(--text); }
  #wrap { flex: 1; position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #status { position: absolute; left: 12px; bottom: 10px; color: var(--muted); font-size: 12px;
    background: var(--panel); padding: 4px 8px; border-radius: 6px; opacity: .92; pointer-events: none; }
  #conn { font-size: 12px; display: flex; align-items: center; gap: 6px; color: var(--muted); }
  #conn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ng); }
  #conn.on::before { background: var(--ok); }
  #toast { position: absolute; right: 12px; bottom: 10px; background: var(--ng); color: #fff;
    padding: 6px 10px; border-radius: 6px; font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
  .hint { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>TRPG Board</h1>
  <div class="seg" id="modes">
    <button data-mode="piece" class="active">コマ</button>
    <button data-mode="terrain">地形</button>
    <button data-mode="edge">仕切り</button>
  </div>
  <div class="group" id="pieceTools">
    <div class="group" id="palette"></div>
    <label for="name">名前</label><input id="name" type="text" maxlength="32" placeholder="ニンジャA">
  </div>
  <div class="group" id="terrainTools" hidden></div>
  <div class="group" id="edgeTools" hidden></div>
  <button class="btn" id="fit">全体表示</button>
  <span id="conn">未接続</span>
  <span class="hint" id="hint"></span>
</header>
<div id="wrap"><canvas id="cv"></canvas><div id="status"></div><div id="toast"></div></div>

<script>
const COLORS = ["#e5484d", "#2f6fde", "#30a46c", "#f5a524", "#8e4ec6", "#444444"];
const TERRAINS = [
  { id: null, label: "床" },
  { id: "wall", label: "壁" },
  { id: "water", label: "水" },
  { id: "rough", label: "悪路" },
  { id: "high", label: "高台" },
];
const EDGES = [
  { id: null, label: "消す" },
  { id: "wall", label: "壁" },
  { id: "window", label: "窓" },
  { id: "door", label: "扉" },
  { id: "door_open", label: "扉(開)" },
];
const HINTS = {
  piece: "空きマスをクリック:配置 / 扉をクリック:開閉 / ドラッグ:移動 / 右クリック・ダブルクリック:削除 / 空白ドラッグ・右ドラッグ:スクロール / ホイール:拡大縮小",
  terrain: "ドラッグ:塗る / 右ドラッグ:スクロール / ホイール:拡大縮小",
  edge: "マスの境目をドラッグ:仕切りを引く(最初の向きに沿って直線) / 右ドラッグ:スクロール / ホイール:拡大縮小",
};

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const statusEl = document.getElementById("status");
const connEl = document.getElementById("conn");
const toastEl = document.getElementById("toast");
const nameInput = document.getElementById("name");

// 盤面の状態(サーバーから受け取る)
let board = null;                    // {width, height}
const entities = new Map();          // id -> entity
const terrain = new Map();           // "x,y" -> type
const edges = new Map();             // "x,y,dir" -> type(dir: h=マスの上辺, v=マスの左辺)

let mode = "piece";
let color = COLORS[0];
let brush = "wall";
let edgeBrush = "wall";
const view = { scale: 16, ox: 0, oy: 0 };  // screen = cell * scale + offset
let hover = null;
let hoverEdge = null;
let drag = null;
let clients = 0;

// ---- ツールバー ----
const paletteEl = document.getElementById("palette");
COLORS.forEach((c, i) => {
  const b = document.createElement("button");
  b.className = "swatch" + (i === 0 ? " active" : "");
  b.style.background = c;
  b.title = c;
  b.onclick = () => { color = c; select(paletteEl, b); };
  paletteEl.appendChild(b);
});
const terrainEl = document.getElementById("terrainTools");
TERRAINS.forEach(t => {
  const b = document.createElement("button");
  b.className = "tile" + (t.id === brush ? " active" : "");
  b.textContent = t.label;
  if (t.id) b.style.setProperty("--swatch", `var(--t-${t.id})`);
  b.onclick = () => { brush = t.id; select(terrainEl, b); };
  terrainEl.appendChild(b);
});
const edgeEl = document.getElementById("edgeTools");
EDGES.forEach(t => {
  const b = document.createElement("button");
  b.className = "tile" + (t.id === edgeBrush ? " active" : "");
  b.textContent = t.label;
  if (t.id) b.style.setProperty("--swatch", `var(--e-${t.id === "door_open" ? "door" : t.id})`);
  b.onclick = () => { edgeBrush = t.id; select(edgeEl, b); };
  edgeEl.appendChild(b);
});
function select(parent, btn) {
  parent.querySelectorAll("button").forEach(x => x.classList.toggle("active", x === btn));
}
const modesEl = document.getElementById("modes");
modesEl.querySelectorAll("button").forEach(b => b.onclick = () => setMode(b.dataset.mode));
function setMode(m) {
  mode = m;
  select(modesEl, modesEl.querySelector(`[data-mode="${m}"]`));
  document.getElementById("pieceTools").hidden = m !== "piece";
  terrainEl.hidden = m !== "terrain";
  edgeEl.hidden = m !== "edge";
  document.getElementById("hint").textContent = HINTS[m];
  draw();
}
document.getElementById("fit").onclick = fit;

let toastTimer;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2500);
}

// ---- 通信 ----
let ws = null;
let retry = 0;
function connect() {
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onopen = () => { retry = 0; };
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onclose = () => {
    ws = null;
    setConn(false);
    setTimeout(connect, Math.min(10000, 500 * 2 ** retry++));
  };
}
function send(msg) {
  if (ws && ws.readyState === WebSocket.OPEN) { ws.send(JSON.stringify(msg)); return true; }
  toast("サーバーに接続されていません");
  return false;
}
function setConn(on) {
  connEl.classList.toggle("on", on);
  connEl.textContent = on ? `接続中・${clients} 人` : "切断(再接続中…)";
}

function handle(msg) {
  switch (msg.type) {
    case "snapshot": {
      const first = board === null;
      board = { width: msg.board.width, height: msg.board.height };
      entities.clear();
      msg.board.entities.forEach(e => entities.set(e.id, e));
      terrain.clear();
      msg.board.terrain.forEach(c => terrain.set(`${c.x},${c.y}`, c.terrain));
      edges.clear();
      msg.board.edges.forEach(e => setEdge(e));
      setConn(true);
      if (first) fit();
      break;
    }
    case "entity.created":
    case "entity.updated":
      entities.set(msg.entity.id, msg.entity);
      break;
    case "entity.deleted":
      entities.delete(msg.id);
      break;
    case "terrain.painted":
      msg.cells.forEach(c => setTerrain(c.x, c.y, c.terrain));
      break;
    case "edges.painted":
      msg.edges.forEach(e => setEdge(e));
      break;
    case "presence":
      clients = msg.clients;
      setConn(true);
      break;
    case "error":
      toast(msg.message);
      break;
  }
  draw();
}

function* cellsBetween(a, b) {
  const n = Math.max(Math.abs(b.x - a.x), Math.abs(b.y - a.y));
  for (let i = 1; i <= n; i++) {
    yield { x: Math.round(a.x + (b.x - a.x) * i / n), y: Math.round(a.y + (b.y - a.y) * i / n) };
  }
}

function setEdge(e) {
  const key = `${e.x},${e.y},${e.dir}`;
  if (e.edge) edges.set(key, e.edge); else edges.delete(key);
}

// 画面座標に一番近い辺。lockDir を渡すとその向きの辺だけを返す(直線を引きやすくする)
function pickEdge(sx, sy, lockDir) {
  const fx = (sx - view.ox) / view.scale, fy = (sy - view.oy) / view.scale;
  const dx = Math.abs(fx - Math.round(fx)), dy = Math.abs(fy - Math.round(fy));
  let dir = lockDir;
  if (!dir) {
    if (Math.min(dx, dy) > 0.3) return null;
    dir = dx < dy ? "v" : "h";
  }
  const e = dir === "v"
    ? { x: Math.round(fx), y: Math.floor(fy), dir }
    : { x: Math.floor(fx), y: Math.round(fy), dir };
  return edgeInBoard(e) ? e : null;
}
function edgeInBoard(e) {
  if (!board) return false;
  const maxX = e.dir === "v" ? board.width : board.width - 1;
  const maxY = e.dir === "h" ? board.height : board.height - 1;
  return e.x >= 0 && e.y >= 0 && e.x <= maxX && e.y <= maxY;
}

let edgeQueue = [];
let edgeTimer = null;
function queueEdge(e, type) {
  const key = `${e.x},${e.y},${e.dir}`;
  if ((edges.get(key) ?? null) === type) return;
  const item = { x: e.x, y: e.y, dir: e.dir, edge: type };
  setEdge(item);
  edgeQueue.push(item);
  if (!edgeTimer) edgeTimer = setTimeout(flushEdges, 60);
}
function flushEdges() {
  clearTimeout(edgeTimer);
  edgeTimer = null;
  if (!edgeQueue.length) return;
  send({ op: "edges.paint", data: { edges: edgeQueue } });
  edgeQueue = [];
}

function setTerrain(x, y, t) {
  if (t) terrain.set(`${x},${y}`, t); else terrain.delete(`${x},${y}`);
}

// 地形はドラッグ中に溜めて少しずつ送る
let paintQueue = [];
let paintTimer = null;
function queuePaint(cell) {
  const key = `${cell.x},${cell.y}`;
  if ((terrain.get(key) ?? null) === brush) return;
  setTerrain(cell.x, cell.y, brush);
  paintQueue.push({ x: cell.x, y: cell.y, terrain: brush });
  if (!paintTimer) paintTimer = setTimeout(flushPaint, 60);
}
function flushPaint() {
  paintTimer = null;
  if (!paintQueue.length) return;
  send({ op: "terrain.paint", data: { cells: paintQueue } });
  paintQueue = [];
}

// ---- 座標 ----
function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function toCell(sx, sy) {
  return { x: Math.floor((sx - view.ox) / view.scale), y: Math.floor((sy - view.oy) / view.scale) };
}
function inBoard(c) { return board && c.x >= 0 && c.y >= 0 && c.x < board.width && c.y < board.height; }
function entityAt(x, y) {
  for (const e of entities.values()) if (e.x === x && e.y === y) return e;
  return null;
}
function eventPos(e) {
  const r = cv.getBoundingClientRect();
  return { sx: e.clientX - r.left, sy: e.clientY - r.top };
}

let fitted = false;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const r = cv.getBoundingClientRect();
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!fitted && board && r.width > 0) fit(); else draw();
}
function fit() {
  const r = cv.getBoundingClientRect();
  if (!board || r.width === 0) return;
  fitted = true;
  const n = Math.max(board.width, board.height);
  view.scale = Math.max(4, Math.floor(Math.min(r.width, r.height) * 0.94 / n));
  view.ox = (r.width - board.width * view.scale) / 2;
  view.oy = (r.height - board.height * view.scale) / 2;
  draw();
}

// ---- 描画 ----
function draw() {
  const r = cv.getBoundingClientRect();
  ctx.clearRect(0, 0, r.width, r.height);
  if (!board) {
    statusEl.textContent = "サーバーに接続しています…";
    return;
  }
  const s = view.scale, W = board.width, H = board.height;

  ctx.fillStyle = css("--board");
  ctx.fillRect(view.ox, view.oy, W * s, H * s);

  // 地形
  const tColors = {};
  for (const t of TERRAINS) if (t.id) tColors[t.id] = css(`--t-${t.id}`);
  for (const [key, t] of terrain) {
    const [x, y] = key.split(",").map(Number);
    ctx.fillStyle = tColors[t];
    ctx.fillRect(view.ox + x * s, view.oy + y * s, s, s);
  }

  // グリッド
  const minor = css("--grid"), major = css("--grid-major");
  for (let i = 0; i <= Math.max(W, H); i++) {
    const isMajor = i % 10 === 0;
    if (!isMajor && s < 6) continue;
    ctx.strokeStyle = isMajor ? major : minor;
    ctx.lineWidth = isMajor ? 1.2 : 1;
    const p = Math.round(i * s) + 0.5;
    ctx.beginPath();
    if (i <= W) { ctx.moveTo(view.ox + p, view.oy); ctx.lineTo(view.ox + p, view.oy + H * s); }
    if (i <= H) { ctx.moveTo(view.ox, view.oy + p); ctx.lineTo(view.ox + W * s, view.oy + p); }
    ctx.stroke();
  }

  // 仕切り
  for (const [key, t] of edges) {
    const [x, y, dir] = key.split(",");
    drawEdge({ x: +x, y: +y, dir }, t, 1);
  }

  // カーソル位置・移動先
  const target = drag?.type === "piece" ? drag.target : hover;
  if (mode === "edge") {
    if (hoverEdge) drawEdge(hoverEdge, edgeBrush ?? "erase", 0.5);
  } else if (target && inBoard(target)) {
    const other = entityAt(target.x, target.y);
    const blocked = drag?.type === "piece" && other && other !== drag.entity;
    ctx.fillStyle = blocked ? "rgba(229,72,77,.3)" : "rgba(47,111,222,.2)";
    ctx.fillRect(view.ox + target.x * s, view.oy + target.y * s, s, s);
  }

  // コマ
  for (const e of entities.values()) {
    if (drag?.type === "piece" && drag.entity.id === e.id && drag.moved) continue;
    drawEntity(e, view.ox + (e.x + .5) * s, view.oy + (e.y + .5) * s, 1);
  }
  if (drag?.type === "piece" && drag.moved) drawEntity(drag.entity, drag.sx, drag.sy, 0.85);

  let info = "—";
  if (hover && inBoard(hover)) {
    info = `(${hover.x}, ${hover.y})`;
    const t = terrain.get(`${hover.x},${hover.y}`);
    if (t) info += " " + TERRAINS.find(x => x.id === t).label;
    const e = entityAt(hover.x, hover.y);
    if (e) info += ` ・ ${e.name || "(名前なし)"}`;
  }
  statusEl.textContent = `マス ${info} ・ コマ ${entities.size} 個`;
}

function drawEdge(e, type, alpha) {
  const s = view.scale;
  const x1 = view.ox + e.x * s, y1 = view.oy + e.y * s;
  const x2 = e.dir === "h" ? x1 + s : x1, y2 = e.dir === "h" ? y1 : y1 + s;
  const w = Math.max(3, s * 0.2);
  ctx.globalAlpha = alpha;
  ctx.lineCap = "butt";
  if (type === "wall" || type === "window") {
    ctx.strokeStyle = css(`--e-${type}`);
    ctx.lineWidth = type === "wall" ? w : w * 0.7;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    if (type === "window") {   // 窓は中央に細い線を入れてガラスっぽく
      ctx.strokeStyle = css("--board");
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
  } else if (type === "door" || type === "door_open") {
    // 扉は辺の 8 割の長さの板。開いているときは枠だけ
    const inset = s * 0.1;
    const rx = e.dir === "h" ? x1 + inset : x1 - w / 2;
    const ry = e.dir === "h" ? y1 - w / 2 : y1 + inset;
    const rw = e.dir === "h" ? s - inset * 2 : w;
    const rh = e.dir === "h" ? w : s - inset * 2;
    ctx.fillStyle = ctx.strokeStyle = css("--e-door");
    if (type === "door") {
      ctx.fillRect(rx, ry, rw, rh);
    } else {
      ctx.lineWidth = 1.5;
      ctx.strokeRect(rx + 0.75, ry + 0.75, rw - 1.5, rh - 1.5);
    }
  } else {                     // 消しゴムのプレビュー
    ctx.strokeStyle = css("--ng");
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawEntity(e, cx, cy, alpha) {
  const rad = view.scale * 0.4;
  ctx.globalAlpha = alpha;
  ctx.fillStyle = e.color;
  ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = 1; ctx.stroke();
  const label = [...(e.name || "")].slice(0, 2).join("");
  if (label && view.scale >= 12) {
    ctx.fillStyle = "#fff";
    ctx.font = `bold ${Math.round(rad * (label.length > 1 ? 0.9 : 1.2))}px system-ui, sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(label, cx, cy + 1);
  }
  ctx.globalAlpha = 1;
}

// ---- 入力 ----
cv.addEventListener("contextmenu", e => e.preventDefault());

cv.addEventListener("pointerdown", e => {
  if (!board) return;
  const { sx, sy } = eventPos(e);
  const cell = toCell(sx, sy);
  cv.setPointerCapture(e.pointerId);
  const pan = { type: "pan", startX: sx, startY: sy, ox: view.ox, oy: view.oy, moved: false, cell, button: e.button };

  if (e.button !== 0) { drag = pan; return; }
  if (mode === "edge") {
    const edge = pickEdge(sx, sy);
    drag = { type: "edge", startX: sx, startY: sy, lastX: sx, lastY: sy, dir: edge?.dir };
    if (edge) queueEdge(edge, edgeBrush);
    draw();
    return;
  }
  if (mode === "terrain") {
    drag = { type: "paint", startX: sx, startY: sy, last: cell };
    if (inBoard(cell)) queuePaint(cell);
    draw();
    return;
  }
  const ent = inBoard(cell) && entityAt(cell.x, cell.y);
  drag = ent
    ? { type: "piece", entity: ent, startX: sx, startY: sy, sx, sy, target: cell, moved: false }
    : pan;
});

cv.addEventListener("pointermove", e => {
  const { sx, sy } = eventPos(e);
  hover = toCell(sx, sy);
  hoverEdge = mode === "edge" ? pickEdge(sx, sy, drag?.type === "edge" ? drag.dir : null) : null;
  if (drag?.type === "edge") {
    // 前回位置から 1/4 マスごとに辺を拾い、速いドラッグでも抜けないようにする
    const steps = Math.max(1, Math.ceil(Math.hypot(sx - drag.lastX, sy - drag.lastY) / (view.scale / 4)));
    for (let i = 1; i <= steps; i++) {
      const px = drag.lastX + (sx - drag.lastX) * i / steps;
      const py = drag.lastY + (sy - drag.lastY) * i / steps;
      const e = pickEdge(px, py, drag.dir);
      if (e) { drag.dir = e.dir; queueEdge(e, edgeBrush); }
    }
    drag.lastX = sx; drag.lastY = sy;
  } else if (drag) {
    if (Math.hypot(sx - drag.startX, sy - drag.startY) > 4) drag.moved = true;
    if (drag.type === "piece") {
      drag.sx = sx; drag.sy = sy; drag.target = hover;
    } else if (drag.type === "paint") {
      // マウスが速いとマスが飛ぶので、前回のマスから直線で埋める
      for (const c of cellsBetween(drag.last, hover)) if (inBoard(c)) queuePaint(c);
      drag.last = hover;
    } else if (drag.moved) {
      view.ox = drag.ox + (sx - drag.startX);
      view.oy = drag.oy + (sy - drag.startY);
    }
  }
  draw();
});

cv.addEventListener("pointerup", () => {
  if (!drag) return;
  const d = drag;
  drag = null;
  if (d.type === "edge") {
    flushEdges();
  } else if (d.type === "paint") {
    flushPaint();
  } else if (d.type === "piece" && d.moved) {
    const t = d.target;
    const other = inBoard(t) && entityAt(t.x, t.y);
    if (inBoard(t) && !other && send({ op: "entity.update", id: d.entity.id, data: { x: t.x, y: t.y } })) {
      d.entity.x = t.x; d.entity.y = t.y;   // 楽観的に動かし、拒否されたらスナップショットで戻る
    }
  } else if (d.type === "piece" && !d.moved) {
    toggleDoorAt(d.startX, d.startY);   // コマのいるマスの辺にある扉もクリックで開閉できる
  } else if (d.type === "pan" && !d.moved && d.button === 0 && mode === "piece" && toggleDoorAt(d.startX, d.startY)) {
    // 扉をクリックしたら開閉(コマの配置より優先)
  } else if (d.type === "pan" && !d.moved && inBoard(d.cell)) {
    const ent = entityAt(d.cell.x, d.cell.y);
    if (d.button === 2 && ent) {
      deleteEntity(ent);
    } else if (d.button === 0 && mode === "piece" && !ent) {
      send({ op: "entity.create", data: { x: d.cell.x, y: d.cell.y, color, name: nameInput.value.trim() } });
    }
  }
  draw();
});

cv.addEventListener("pointerleave", () => { if (!drag) { hover = null; hoverEdge = null; draw(); } });

cv.addEventListener("dblclick", e => {
  if (mode !== "piece") return;
  const { sx, sy } = eventPos(e);
  const cell = toCell(sx, sy);
  const ent = inBoard(cell) && entityAt(cell.x, cell.y);
  if (ent) deleteEntity(ent);
});

function toggleDoorAt(sx, sy) {
  // 角の近くでは縦横どちらの辺か曖昧なので、近くの縦横両方から扉を探す
  const fx = (sx - view.ox) / view.scale, fy = (sy - view.oy) / view.scale;
  const near = [
    [Math.abs(fx - Math.round(fx)), pickEdge(sx, sy, "v")],
    [Math.abs(fy - Math.round(fy)), pickEdge(sx, sy, "h")],
  ].filter(([d, e]) => e && d <= 0.3).sort((a, b) => a[0] - b[0]);
  for (const [, e] of near) {
    const t = edges.get(`${e.x},${e.y},${e.dir}`);
    if (t === "door" || t === "door_open") {
      queueEdge(e, t === "door" ? "door_open" : "door");
      flushEdges();
      return true;
    }
  }
  return false;
}

function deleteEntity(ent) {
  if (send({ op: "entity.delete", id: ent.id })) { entities.delete(ent.id); draw(); }
}

cv.addEventListener("wheel", e => {
  e.preventDefault();
  const { sx, sy } = eventPos(e);
  const next = Math.min(80, Math.max(4, view.scale * (e.deltaY < 0 ? 1.15 : 1 / 1.15)));
  const k = next / view.scale;
  view.ox = sx - (sx - view.ox) * k;
  view.oy = sy - (sy - view.oy) * k;
  view.scale = next;
  draw();
}, { passive: false });

new ResizeObserver(resize).observe(cv);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
setMode("piece");
connect();
</script>
</body>
</html>
